project_id = "ahlpvlhmpfiyeoercxol"

# Block public self-registration. Keep the email provider enabled so existing
# admins can sign in and master admins can send invitation links from the server.
[auth]
enable_signup = false

# This endpoint verifies the signed-in Master Admin JWT and role itself.
[functions.admin-team]
verify_jwt = false

[functions.issue-bb3-unlock]
verify_jwt = true

[functions.verify-legacy-bb2]
verify_jwt = false

[functions.bootstrap-first-admin]
verify_jwt = false

[functions.submit-public-contact]
verify_jwt = false

# The public downloader authenticates server-side with the service-role key,
# checks the is_public release flag, and returns only a short-lived signed URL.
[functions.public-apk-download]
verify_jwt = false

[functions.create-payment-checkout]
verify_jwt = true

[functions.payment-gateway-webhook]
verify_jwt = false

[functions.manage-payment-refund]
verify_jwt = true

[functions.request-desktop-owner-otp]
verify_jwt = false

# The refresh route accepts only high-entropy, single-use per-device refresh
# credentials and performs its own database verification; it does not trust JWT headers.
[functions.android-device-auth]
verify_jwt = false

# iPhone enrollment, single-use credential refresh and device-header-authenticated
# signed snapshot sync verify their own shop/device authority in the Edge Function.
[functions.ios-device-auth]
verify_jwt = false

[functions.send-auth-sms]
verify_jwt = false
