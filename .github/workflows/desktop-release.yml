name: BeBoss Desktop release
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Verify release configuration
        shell: pwsh
        run: |
          if (-not $env:VITE_SUPABASE_URL -or -not $env:VITE_SUPABASE_PUBLISHABLE_KEY) {
            throw "Configure SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets before building the production desktop installer."
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify desktop package, Tauri and Rust versions are identical
        run: npm run check:versions
      - name: Type-check and build renderer
        run: |
          npm run check:types
          npm run build
      - name: Test native encrypted database and lifecycle primitives
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows installer
        run: npm run dist:win
      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            throw "Configure WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD repository secrets before releasing."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "beboss-release-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            $installers = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe"
            if (-not $installers) { throw "No Windows installer was produced." }
            foreach ($installer in $installers) {
              & $signTool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.Name)." }
              & $signTool verify /pa /v $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($installer.Name)." }
            }
          } finally {
            if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Desktop-Windows-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
