name: Build BeBoss React Native iPhone app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios-react-native.yml"
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios-react-native.yml"

permissions:
  contents: read

concurrency:
  group: beboss-react-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iphone:
    name: Build physical iPhone app (iphoneos arm64)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios-app

      - name: Verify physical-device SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos
          ! xcodebuild -showsdks | grep -q iphonesimulator

      - name: Install React Native dependencies
        working-directory: ios-app
        run: npm install --no-audit --no-fund

      - name: Type-check the application
        working-directory: ios-app
        run: npm run typecheck

      - name: Test portable POS business rules
        working-directory: ios-app
        run: npm test -- --runInBand

      - name: Install iOS native dependencies
        working-directory: ios-app
        run: bundle exec pod install --project-directory=ios

      - name: Compile and link the actual iPhone application
        working-directory: ios-app
        run: |
          xcodebuild \
            -project ios/BeBoss.xcodeproj \
            -scheme BeBoss \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload unsigned iPhone-device app bundle
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-iPhone-unsigned-device-app
          path: ios-app/build/ios-device/Build/Products/Release-iphoneos/BeBoss.app
          if-no-files-found: error
          retention-days: 30
