name: BeBoss Tauri multi-platform packages

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/tauri-multiplatform.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/tauri-multiplatform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Tauri package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64-nsis
            runner: windows-2022
            script: dist:win
            bundle: nsis
          - label: macos-dmg
            runner: macos-15
            script: dist:mac
            bundle: dmg
          - label: linux-x64-appimage
            runner: ubuntu-22.04
            script: dist:linux
            bundle: appimage
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    env:
      VITE_SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SFUKqYETliLdgqluQBQ2xg_XJNudcvM
      # Force the runner-host stable toolchain for cargo and Tauri's build subprocesses.
      # Do not inherit a target-specific toolchain alias from a developer/runner override.
      # Always use the runner's native host toolchain (not a Windows cross-target
      # toolchain left in the environment) for each OS package build.
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject exposed or invalid Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: ../.github/scripts/verify-windows-signing-certificate.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin this runner to its host stable Rust toolchain
        run: rustup override set stable

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Perl for Windows SQLCipher build
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install pinned desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Build desktop frontend
        run: npm run build

      - name: Check native Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test native Rust synchronization primitives
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build native desktop package
        run: npm run ${{ matrix.script }}

      - name: Require trusted Authenticode signature for Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            throw "Refusing to publish an unsigned Windows package. Configure WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD in GitHub Actions secrets."
          }
          $installerDirectory = "src-tauri/target/release/bundle/${{ matrix.bundle }}"
          $installers = Get-ChildItem $installerDirectory -Filter "*.exe" -File
          if (-not $installers) { throw "No Windows installer was produced." }
          $certificatePath = Join-Path $env:RUNNER_TEMP "beboss-release-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            foreach ($installer in $installers) {
              & $signTool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($installer.Name)." }
              & $signTool verify /pa /v $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.Name)." }
              $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
              if ($signature.Status -ne "Valid") { throw "Windows reports an invalid signature for $($installer.Name): $($signature.StatusMessage)" }
            }
          } finally {
            if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
          }

      - name: Generate SHA-256 package manifest
        run: node scripts/generate-bundle-checksums.mjs "src-tauri/target/release/bundle/${{ matrix.bundle }}"

      - name: Publish unsigned package and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Tauri-${{ matrix.label }}-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 14
