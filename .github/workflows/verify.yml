name: Verify BeBoss

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, tests and production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-for-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno for Supabase Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase payment Edge Functions
        run: |
          deno check --no-lock supabase/functions/create-payment-checkout/index.ts
          deno check --no-lock supabase/functions/payment-gateway-webhook/index.ts
          deno check --no-lock supabase/functions/redeem-shop-device-invite/index.ts
          deno check --no-lock supabase/functions/bootstrap-shop-owner/index.ts

      - name: Test payment gateway primitives
        run: deno test --allow-env supabase/functions/_shared/payment-gateway.test.ts

      - name: Test owner OTP rate-limit isolation
        run: deno test supabase/functions/_shared/owner-otp-rate-limit.test.ts

      - name: Lint changed security and authentication files
        run: >-
          npx eslint --no-warn-ignored
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
          src/lib/admin.functions.ts
          src/lib/pricing.ts
          src/routes/_authenticated/admin/payments.tsx
          src/lib/bb2.ts
          src/lib/bb2.test.ts
          src/lib/public.functions.ts
          src/routes/my-shop.tsx
          src/lib/admin-queries.ts
          src/lib/server/public-client.ts
          src/integrations/supabase/auth-middleware.ts
          src/components/site/ModernHero.tsx
          src/components/site/SiteHeader.tsx
          src/routes/_authenticated/admin/settings.tsx
          src/routes/_authenticated/admin/sync.tsx
          src/routes/auth.tsx
          supabase/functions/bootstrap-first-admin/index.ts
          supabase/functions/issue-bb3-unlock/index.ts
          supabase/functions/verify-legacy-bb2/index.ts
          supabase/functions/submit-public-contact/index.ts
          supabase/functions/redeem-shop-device-invite/index.ts
          supabase/functions/bootstrap-shop-owner/index.ts
          src/integrations/supabase/types.ts
          src/lib/security-concurrency.integration.test.ts
          src/routes/contact.tsx

      - name: Run unit tests
        run: npm run test

      - name: Build production web app for Vercel
        run: npm run build
        env:
          VERCEL: "1"

      - name: Verify Vercel server-function output
        run: |
          test -s .vercel/output/config.json
          test -d .vercel/output/functions
          test -d .vercel/output/static

  security-integration:
    name: Supabase device-auth security acceptance (staging)
    if: ${{ vars.BEBOSS_DEVICE_AUTH_STAGING_PROJECT_REF != '' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      BEBOSS_RUN_SECURITY_INTEGRATION_TESTS: "1"
      BEBOSS_TEST_DATABASE_URL: ${{ secrets.BEBOSS_DEVICE_AUTH_STAGING_DATABASE_URL }}
      BEBOSS_TEST_PROJECT_REF: ${{ vars.BEBOSS_DEVICE_AUTH_STAGING_PROJECT_REF }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run destructive security fixtures against staging only
        run: npx vitest run src/lib/security-concurrency.integration.test.ts

  android:
    name: Android JVM unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create CI debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          validate-wrappers: false

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build installable Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Android-2.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
