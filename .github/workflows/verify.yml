name: Verify BeBoss

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, tests and production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-for-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno for Supabase Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase payment Edge Functions
        run: |
          deno check --no-lock supabase/functions/create-payment-checkout/index.ts
          deno check --no-lock supabase/functions/payment-gateway-webhook/index.ts
          deno check --no-lock supabase/functions/manage-payment-refund/index.ts
          deno check --no-lock supabase/functions/beboss-desktop/index.ts
          deno check --no-lock supabase/functions/request-desktop-owner-otp/index.ts
          deno check --no-lock supabase/functions/android-device-auth/index.ts

      - name: Test payment gateway primitives
        run: deno test --allow-env supabase/functions/_shared/payment-gateway.test.ts

      - name: Test Android device credential primitives
        run: deno test --no-lock supabase/functions/_shared/device-credentials.test.ts

      - name: Test provider settlement identity, amount and currency checks
        run: deno test --no-lock supabase/functions/_shared/payment-settlement.test.ts

      - name: Lint changed security and authentication files
        run: >-
          npx eslint --no-warn-ignored
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
          src/lib/admin.functions.ts
          src/lib/pricing.ts
          src/routes/_authenticated/admin/payments.tsx
          src/lib/bb2.ts
          src/lib/bb2.test.ts
          src/lib/public.functions.ts
          src/routes/my-shop.tsx
          src/lib/admin-queries.ts
          src/lib/server/public-client.ts
          src/integrations/supabase/auth-middleware.ts
          src/components/site/ModernHero.tsx
          src/components/site/SiteHeader.tsx
          src/routes/_authenticated/admin/settings.tsx
          src/routes/_authenticated/admin/sync.tsx
          src/routes/auth.tsx
          supabase/functions/bootstrap-first-admin/index.ts
          supabase/functions/issue-bb3-unlock/index.ts
          supabase/functions/verify-legacy-bb2/index.ts
          supabase/functions/submit-public-contact/index.ts
          src/lib/security-concurrency.integration.test.ts
          src/routes/contact.tsx

      - name: Run unit tests
        run: npm run test

      - name: Build production web app for Vercel
        run: npm run build
        env:
          VERCEL: "1"

      - name: Verify Vercel server-function output
        run: |
          test -s .vercel/output/config.json
          test -d .vercel/output/functions
          test -d .vercel/output/static

  desktop:
    name: Desktop Tauri frontend and native checks
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Perl for bundled SQLCipher OpenSSL
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build desktop client
        run: npm run build

      - name: Check native Tauri application
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test native synchronization primitives
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install NSIS for the Windows installer
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build the native Windows NSIS installer
        run: npm run dist:win

      - name: Verify the Windows installer artifact exists
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installers -or $installers.Count -eq 0) { throw "Tauri did not produce a Windows NSIS installer." }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) { throw "Windows installer is unexpectedly small: $($installer.Name)" }
          }

      - name: Publish unsigned Windows installer for CI inspection
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Windows-NSIS-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android JVM unit tests
    runs-on: ubuntu-24.04
    env:
      BEBOSS_DATASHARE_HMAC_SECRET: ${{ secrets.BEBOSS_DATASHARE_HMAC_SECRET }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create CI debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          validate-wrappers: false

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify Android DataShare signing fails closed without the shared secret
        shell: bash
        env:
          BEBOSS_DATASHARE_HMAC_SECRET: ""
        run: |
          set +e
          output="$(gradle :app:validateDataShareSigningConfiguration 2>&1)"
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Android DataShare signing incorrectly accepted a missing shared HMAC key."
            exit 1
          fi
          if ! grep -Fq "Android DataShare signing is not configured." <<< "$output"; then
            echo "The expected fail-closed DataShare signing error was not found."
            exit 1
          fi

      - name: Verify Android release signing fails closed without production credentials
        shell: bash
        env:
          KEYSTORE_PATH: ""
          STORE_PASSWORD: ""
          KEY_PASSWORD: ""
        run: |
          set +e
          output="$(gradle :app:validateReleaseSigningConfiguration 2>&1)"
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Release signing incorrectly accepted missing production credentials."
            exit 1
          fi
          if ! grep -Fq "Release signing is not configured." <<< "$output"; then
            echo "The expected fail-closed release-signing error was not found."
            exit 1
          fi

      - name: Build installable Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Android-2.3.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build and verify signed Android production APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BEBOSS_DATASHARE_HMAC_SECRET: ${{ secrets.BEBOSS_DATASHARE_HMAC_SECRET }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS BEBOSS_DATASHARE_HMAC_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required protected Android release secret: $name"
              exit 1
            fi
          done
          export KEYSTORE_PATH="$RUNNER_TEMP/beboss-upload-keystore.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          gradle :app:bundleRelease :app:assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Publish signed Android production artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Android-2.3.2-production-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  sign-windows-installer:
    name: Authenticode sign and verify the Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: windows-2022
    steps:
      - name: Download the native NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: BeBoss-Windows-NSIS-${{ github.sha }}
          path: installers

      - name: Sign and verify the installer with the production certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw "Set WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD before creating a signed Windows release."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "beboss-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK SignTool was not found on the runner." }
          $installers = Get-ChildItem "installers" -Filter "*.exe" -File
          if (-not $installers -or $installers.Count -eq 0) { throw "No native NSIS installer was downloaded." }
          foreach ($installer in $installers) {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CODESIGN_PFX_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($installer.Name)." }
            & $signTool.FullName verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.Name)." }
          }

      - name: Publish signed Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Windows-signed-${{ github.ref_name }}
          path: installers/*.exe
          if-no-files-found: error
          retention-days: 30
