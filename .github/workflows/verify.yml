name: Verify BeBoss

# CI validates source and installation behavior only. Customer release binaries are built locally and uploaded by an authorized release manager.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'feat/**', 'security/**', 'fix/**', 'chore/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflow files
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint every workflow and context expression
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  web:
    name: Web lint, tests and production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-for-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Synchronize the npm lockfile for Cloudflare Worker dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Deno for Supabase Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase payment Edge Functions
        run: |
          deno check --no-lock supabase/functions/create-payment-checkout/index.ts
          deno check --no-lock supabase/functions/payment-gateway-webhook/index.ts
          deno check --no-lock supabase/functions/manage-payment-refund/index.ts
          deno check --no-lock supabase/functions/beboss-desktop/index.ts
          deno check --no-lock supabase/functions/request-desktop-owner-otp/index.ts
          deno check --no-lock supabase/functions/android-device-auth/index.ts
          deno check --no-lock supabase/functions/send-auth-sms/index.ts
          deno check --no-lock supabase/functions/public-apk-download/index.ts
          deno check --no-lock supabase/functions/admin-team/index.ts
          deno check --no-lock supabase/functions/manage-app-secrets/index.ts

      - name: Test payment gateway primitives
        run: deno test --allow-env supabase/functions/_shared/payment-gateway.test.ts

      - name: Test snapshot generation integrity
        run: deno test --no-lock supabase/functions/_shared/snapshot-generations.test.ts

      - name: Test Android device credential primitives
        run: deno test --no-lock supabase/functions/_shared/device-credentials.test.ts

      - name: Test branch and stock-transfer audit transitions
        run: deno test --no-lock supabase/functions/_shared/shop-audit.test.ts

      - name: Test device billing and Africa's Talking SMS primitives
        run: |
          deno test --no-lock supabase/functions/_shared/shop-management.test.ts
          deno test --no-lock supabase/functions/_shared/africastalking.test.ts

      - name: Test provider settlement identity, amount and currency checks
        run: deno test --no-lock supabase/functions/_shared/payment-settlement.test.ts

      - name: Type-check and test MTN MoMo sandbox and Rwanda production adapter
        run: |
          deno check --no-lock supabase/functions/_shared/mtn-momo.ts
          deno test --allow-env --no-lock supabase/functions/_shared/mtn-momo.test.ts

      - name: Lint all web application and Supabase Edge Function source
        run: >-
          npx eslint --no-warn-ignored
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule 'no-eval: error'
          --rule 'no-new-func: error'
          --rule 'no-implied-eval: error'
          --rule 'no-script-url: error'
          src
          supabase/functions

      - name: Verify every admin server function has authentication and role/permission guards
        run: node scripts/check-admin-rbac.mjs

      - name: Verify desktop owner identity mapping is tenant-safe
        run: node ../.github/scripts/check-desktop-owner-identity.mjs

      - name: Verify owner portal tenant scoping and cutover compatibility
        run: node ../.github/scripts/check-owner-portal-tenant-scope.mjs

      - name: Verify Android and desktop shop-scoped DataShare protocol alignment
        run: node ../.github/scripts/check-datashare-protocol.mjs

      - name: Verify Supabase migration versions are unique
        run: npm run check:migrations

      - name: Verify Android does not bundle the deprecated global LAN secret
        run: node ../.github/scripts/check-android-lan-secret.mjs

      - name: Run unit tests
        run: npm run test

      - name: Build production web app for Cloudflare Workers
        run: npm run build

      - name: Validate the Cloudflare Worker deployment bundle
        run: npx wrangler deploy --dry-run --outdir .cloudflare/dry-run

  tenant-security-database:
    name: Supabase tenant-isolation database tests
    runs-on: ubuntu-24.04
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          # The hosted Ubuntu image can carry a Microsoft package feed that
          # intermittently returns 403 and makes apt-get update fail globally.
          # This database-only job does not need packages from that feed.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -delete
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply production base schema and all migrations, then test tenant isolation
        run: bash .github/scripts/tenant-isolation-db-tests.sh

  desktop:
    name: Desktop source checks and installer smoke test (CI only)
    runs-on: windows-2022
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN || secrets.SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN || secrets.SENTRY_DSN }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Perl for bundled SQLCipher OpenSSL
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Synchronize desktop npm lockfile for new observability dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install desktop dependencies from the synchronized npm lockfile
        run: npm ci --no-audit --no-fund

      - name: Run desktop client regression tests
        run: npm test

      - name: Verify desktop package, Tauri and Rust versions are identical
        run: npm run check:versions
      - name: Verify NSIS upgrade policy, assets and protected-data safeguards
        run: npm run check:installer

      - name: Check desktop TypeScript types
        run: npm run check:types
      - name: Build desktop client
        run: npm run build

      - name: Check native Tauri application
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test native synchronization primitives
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install NSIS for the Windows installer
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install the native Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Verify NSIS artwork is present
        shell: pwsh
        run: |
          foreach ($asset in @("src-tauri/installer/header.bmp", "src-tauri/installer/sidebar.bmp")) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing NSIS installer artwork: $asset" }
          }

      - name: Build an ephemeral Windows NSIS installer for install/uninstall smoke tests only
        run: cargo tauri build --bundles nsis

      - name: Verify the Windows installer artifact exists
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installers -or $installers.Count -eq 0) { throw "Tauri did not produce a Windows NSIS installer." }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1MB) { throw "Windows installer is unexpectedly small: $($installer.Name)" }
          }

      - name: Install, launch-target check, and uninstall the native Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No BeBoss NSIS installer is available for the install smoke test." }
          $installRoot = Join-Path $env:RUNNER_TEMP "beboss-installer-smoke"
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "BeBoss installer returned exit code $($install.ExitCode)." }

          $appExe = Join-Path $installRoot "BeBoss.exe"
          $uninstaller = Join-Path $installRoot "Uninstall.exe"
          if (-not (Test-Path $appExe -PathType Leaf)) { throw "The installed BeBoss.exe launch target is missing." }
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "The registered BeBoss uninstaller is missing." }

          $startMenuLink = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\BeBoss\BeBoss.lnk"
          if (-not (Test-Path $startMenuLink -PathType Leaf)) {
            $startMenuLink = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\BeBoss\BeBoss Desktop.lnk"
          }
          if (-not (Test-Path $startMenuLink -PathType Leaf)) { throw "The BeBoss Start Menu application shortcut is missing." }

          # Seed a representative locked-cache recovery archive. Re-running the
          # installer must replace app binaries while leaving encrypted payloads
          # and the queued offline work byte-for-byte intact.
          $appData = Join-Path $env:APPDATA "com.beboss.desktop"
          $recoveryFixture = Join-Path $appData "recovery\locked-cache-upgrade-test"
          New-Item -ItemType Directory -Force -Path $recoveryFixture | Out-Null
          $protectedFixtures = @(
            (Join-Path $recoveryFixture "beboss-local.sqlite"),
            (Join-Path $recoveryFixture "pending-outbox.json"),
            (Join-Path $recoveryFixture "beboss-local.sqlite.dpapi-key")
          )
          $fixturePayloads = @("encrypted-database-preservation-fixture", "queued-offline-operations-fixture", "protected-key-backup-fixture")
          for ($i = 0; $i -lt $protectedFixtures.Count; $i++) {
            Set-Content -LiteralPath $protectedFixtures[$i] -Value $fixturePayloads[$i] -NoNewline
          }
          $fixtureHashes = @{}
          foreach ($fixture in $protectedFixtures) {
            $fixtureHashes[$fixture] = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
          }

          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "BeBoss in-place upgrade returned exit code $($upgrade.ExitCode)." }
          if (-not (Test-Path $appExe -PathType Leaf)) { throw "The BeBoss.exe application was not replaced during upgrade." }
          foreach ($fixture in $protectedFixtures) {
            if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) { throw "Upgrade deleted protected recovery data: $fixture" }
            $afterHash = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
            if ($afterHash -ne $fixtureHashes[$fixture]) { throw "Upgrade modified encrypted data or a pending sync payload: $fixture" }
          }
          Write-Host "In-place upgrade replaced app files and preserved encrypted DB, key backup and pending sync archive."

          # Launch the installed native GUI process, not only inspect its executable.
          # A missing WebView2 runtime or broken native bundle must fail this test.
          $application = Start-Process -FilePath $appExe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($application.HasExited) {
              throw "BeBoss.exe exited during native application startup with code $($application.ExitCode)."
            }
            Write-Host "BeBoss native application remained running after startup."
          } finally {
            if (-not $application.HasExited) {
              Stop-Process -Id $application.Id -Force
              Wait-Process -Id $application.Id -Timeout 15 -ErrorAction SilentlyContinue
            }
          }

          # Place a sentinel in the app's official per-user data location. A proper
          # uninstall removes binaries and shortcuts but must retain this data.
          New-Item -ItemType Directory -Force -Path $appData | Out-Null
          $sentinel = Join-Path $appData "installer-uninstall-preservation-test.txt"
          Set-Content -Path $sentinel -Value "preserve-shop-data" -NoNewline

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "BeBoss uninstaller returned exit code $($uninstall.ExitCode)." }
          if (Test-Path $appExe) { throw "BeBoss application files were not removed by uninstall." }
          if (-not (Test-Path $sentinel)) { throw "Uninstall removed the per-user app-data directory; shop data would be lost." }
          foreach ($fixture in $protectedFixtures) {
            if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) { throw "Uninstall removed protected recovery data: $fixture" }
          }

          Remove-Item $sentinel -Force
          Remove-Item (Split-Path $protectedFixtures[0] -Parent) -Recurse -Force
          Write-Host "NSIS install/uninstall passed; Start Menu shortcut created and user data preserved."

  android:
    name: Android tests and debug-only build validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN || secrets.SENTRY_DSN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Supabase TLS pin discovery utility
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-tls-pin-tool"
          javac -Xlint:all -d "$RUNNER_TEMP/supabase-tls-pin-tool" scripts/PrintSupabaseTlsPins.java

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create CI debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          validate-wrappers: false

      - name: Inspect generated Android BuildConfig before compilation
        run: |
          gradle :app:generateSecureDebugBuildConfig :app:generateTransitionDebugBuildConfig --stacktrace
          echo "----- Locating flavor-specific generated BuildConfig.java files -----"
          mapfile -t configs < <(find app/build/generated -type f -name BuildConfig.java)
          printf '%s\n' "${configs[@]}"
          if [ "${#configs[@]}" -ne 2 ]; then
            echo "Expected exactly two generated BuildConfig.java files (secure and transition), found ${#configs[@]}."
            exit 1
          fi
          secure_config=""
          transition_config=""
          for config_file in "${configs[@]}"; do
            if grep -Fq 'BEBOSS_SECURITY_PEPPER' "$config_file"; then
              transition_config="$config_file"
            else
              secure_config="$config_file"
            fi
          done
          if [ -z "$secure_config" ] || [ -z "$transition_config" ]; then
            echo "Could not identify both secure and transition Android BuildConfig files."
            exit 1
          fi
          echo "Secure variant: $secure_config"
          echo "Transition variant: $transition_config"
          sed -n '1,45p' "$secure_config"

      - name: Verify server-only credentials are not embedded in Android
        shell: bash
        run: |
          config="$(find app/build/generated -type f -name BuildConfig.java | while read -r file; do if ! grep -Fq 'BEBOSS_SECURITY_PEPPER' "$file"; then printf '%s\n' "$file"; fi; done | head -n 1)"
          transition="$(find app/build/generated -type f -name BuildConfig.java | while read -r file; do if grep -Fq 'BEBOSS_SECURITY_PEPPER' "$file"; then printf '%s\n' "$file"; fi; done | head -n 1)"
          if [ -z "$config" ] || [ -z "$transition" ]; then
            echo "Both secret-free secure and migration-only transition BuildConfig files are required."
            exit 1
          fi
          if grep -Eq 'AFRICASTALKING_|AIRTEL_MONEY_|MTN_MOMO_|SEND_SMS_HOOK_SECRET|FLW_SECRET_KEY|STRIPE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|BEBOSS_DATASHARE_HMAC_SECRET|BEBOSS_SECURITY_PEPPER' "$config"; then
            echo "The final secure Android variant embedded a server credential or migration-only compatibility secret."
            exit 1
          fi
          if ! grep -Fq 'BEBOSS_SECURITY_PEPPER' "$transition"; then
            echo "The one-time transition Android variant is missing its protected legacy credential pepper."
            exit 1
          fi
          if grep -Fq 'BEBOSS_DATASHARE_HMAC_SECRET' "$transition"; then
            echo "The Android transition variant must not embed the old global DataShare key."
            exit 1
          fi
          if grep -Fq ' = ;' "$config"; then
            echo "Android BuildConfig contains an invalid empty Java constant."
            exit 1
          fi

      - name: Validate standalone Android signing helper scripts
        shell: pwsh
        run: ./scripts/test-android-signing-tools.ps1

      - name: Run Android unit tests (retry transient Maven Central rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android unit-test attempt ${attempt}/3"
            if gradle :app:testSecureDebugUnitTest :app:testTransitionDebugUnitTest --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gradle failed; retrying after ${delay}s (this also covers transient Maven Central HTTP 429 responses)."
              sleep "$delay"
            fi
          done
          echo "Android unit tests failed after three attempts."
          exit 1

      - name: Run Android instrumentation smoke tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          disable-animations: true
          script: gradle :app:connectedSecureDebugAndroidTest --stacktrace

      # Always run the remaining independent release-safety and compile checks
      # even when a hosted Android emulator fails to start.
      - name: Verify Android release signing fails closed without production credentials
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          KEYSTORE_PATH: ""
          STORE_PASSWORD: ""
          KEY_PASSWORD: ""
          KEY_ALIAS: ""
        run: |
          set +e
          output="$(gradle --configuration-cache :app:validateReleaseSigningConfiguration 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Release signing incorrectly accepted missing production credentials."
            exit 1
          fi
          if ! grep -Fq "Release signing is not configured." <<< "$output"; then
            echo "The expected fail-closed release-signing error was not found."
            exit 1
          fi

      - name: Compile Android debug variant for CI validation only
        if: ${{ always() && !cancelled() }}
        run: gradle :app:assembleSecureDebug :app:assembleTransitionDebug --stacktrace
