name: BeBoss Windows setup installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beboss-windows-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    name: Build Windows NSIS setup executable
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop
    env:
      VITE_SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SFUKqYETliLdgqluQBQ2xg_XJNudcvM
      RUSTUP_TOOLCHAIN: stable
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and release outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> desktop/src-tauri/target

      - name: Set up Perl for bundled SQLCipher OpenSSL
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install locked desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Check native package versions
        run: npm run check:versions

      - name: Build production desktop frontend
        run: npm run build

      - name: Build actual Windows NSIS installer
        run: npm run dist:win

      - name: Verify setup executable exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri did not produce a Windows NSIS setup executable." }
          Write-Host "Built installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 1000000) { throw "The setup executable is unexpectedly small." }

      - name: Authenticode sign and verify installer when production certificate is configured
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installers) { throw "No Windows setup executable exists to sign." }
          $statusPath = Join-Path "src-tauri/target/release/bundle/nsis" "signature-status.txt"
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -and -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            "signature=unsigned; reason=Authenticode certificate secrets are not configured" | Set-Content $statusPath
            Write-Warning "Installer is built but unsigned. Configure WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD for production distribution."
            exit 0
          }
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            throw "Both Windows signing certificate secrets must be configured together."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "beboss-release-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            foreach ($installer in $installers) {
              & $signTool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($installer.Name)." }
              & $signTool verify /pa /v $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.Name)." }
            }
            "signature=Authenticode signed and verified" | Set-Content $statusPath
          } finally {
            if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
          }
      - name: Generate SHA-256 manifest
        run: node scripts/generate-bundle-checksums.mjs "src-tauri/target/release/bundle/nsis"

      - name: Publish BeBoss Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Windows-Setup-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
