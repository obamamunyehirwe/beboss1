name: BeBoss Windows setup installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beboss-windows-setup-${{ github.ref }}
  # Do not cancel an expensive native release build when unrelated main commits land.
  cancel-in-progress: false

jobs:
  windows-setup:
    name: Build Windows NSIS setup executable
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop
    env:
      VITE_SUPABASE_URL: https://ahlpvlhmpfiyeoercxol.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SFUKqYETliLdgqluQBQ2xg_XJNudcvM
      RUSTUP_TOOLCHAIN: stable
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Windows signing material when configured
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)
          if (-not $hasPfx -and -not $hasPassword) {
            Write-Warning "No signing secrets configured. This workflow will build an unsigned CI inspection artifact only."
            exit 0
          }
          if (-not $hasPfx -or -not $hasPassword) {
            throw "Configure both Windows signing secrets together."
          }
          ../.github/scripts/verify-windows-signing-certificate.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and release outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> desktop/src-tauri/target

      - name: Set up Perl for bundled SQLCipher OpenSSL
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install locked desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Check native package versions
        run: npm run check:versions

      - name: Build production desktop frontend
        run: npm run build

      - name: Build actual Windows NSIS installer
        run: npm run dist:win

      - name: Verify setup executable exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri did not produce a Windows NSIS setup executable." }
          Write-Host "Built installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          if ($installer.Length -lt 1000000) { throw "The setup executable is unexpectedly small." }

      - name: Sign and verify Windows installer when a protected certificate is configured
        shell: pwsh
        run: |
          $installerDirectory = "src-tauri/target/release/bundle/nsis"
          $installers = Get-ChildItem $installerDirectory -Filter "*.exe" -File
          if (-not $installers) { throw "No Windows setup executable exists." }
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -and -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            "signature=unsigned CI inspection build; NOT FOR PRODUCTION DISTRIBUTION" | Set-Content (Join-Path $installerDirectory "signature-status.txt")
            Write-Warning "Unsigned CI inspection artifact. It must not be distributed to merchants."
            exit 0
          }
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            throw "Both Windows signing secrets must be configured together."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "beboss-release-signing.pfx"
          $priorPath = $env:WINDOWS_CODESIGN_PFX_PATH
          try {
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String(($env:WINDOWS_CODESIGN_PFX_BASE64 -replace "\s", "")))
            $env:WINDOWS_CODESIGN_PFX_PATH = $certificatePath
            & scripts/sign-windows-installer.ps1 -PfxPath $certificatePath -InstallerDirectory $installerDirectory
            if ($LASTEXITCODE -ne 0) { throw "The shared local signing script failed." }
          } finally {
            if ($priorPath) { $env:WINDOWS_CODESIGN_PFX_PATH = $priorPath } else { Remove-Item Env:WINDOWS_CODESIGN_PFX_PATH -ErrorAction SilentlyContinue }
            if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
          }

      - name: Generate SHA-256 manifest
        run: node scripts/generate-bundle-checksums.mjs "src-tauri/target/release/bundle/nsis"

      - name: Publish BeBoss Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: BeBoss-Windows-Setup-CI-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 14
